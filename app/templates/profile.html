{% extends "dashboard_base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-brand-dark">My Profile</h1>
        <p class="text-gray-500 mt-1">Update your personal information and password.</p>
    </div>

    <!-- Avatar + Name card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 flex items-center gap-5">
        <div class="w-16 h-16 rounded-full bg-brand-light text-brand-blue flex items-center justify-center text-2xl font-extrabold flex-shrink-0" id="avatar-circle">
            U
        </div>
        <div>
            <p class="text-xl font-bold text-gray-900" id="profile-name-display">Loading...</p>
            <p class="text-sm text-gray-500" id="profile-email-display"></p>
            <span class="mt-1 inline-block text-xs font-bold uppercase px-2 py-0.5 rounded-full bg-blue-100 text-blue-700" id="profile-role-display"></span>
        </div>
    </div>

    <!-- Profile Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
        <div class="px-6 py-4 bg-gray-50 border-b border-gray-100">
            <h2 class="text-base font-bold text-gray-900">Personal Information</h2>
        </div>
        <form id="profile-form" onsubmit="saveProfile(event)" class="p-6 space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="pf-full-name"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue"
                        placeholder="Your full name">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" id="pf-phone"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue"
                        placeholder="e.g. 08012345678">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="pf-email" required
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue">
            </div>
            <div class="flex justify-end pt-2">
                <button type="submit" id="pf-save-btn"
                    class="bg-brand-blue text-white font-bold py-2.5 px-8 rounded-xl hover:bg-brand-dark transition shadow-md flex items-center gap-2">
                    <i class="fas fa-save"></i> Save Info
                </button>
            </div>
        </form>
    </div>

    <!-- Password Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 bg-gray-50 border-b border-gray-100">
            <h2 class="text-base font-bold text-gray-900">Change Password</h2>
        </div>
        <form id="password-form" onsubmit="savePassword(event)" class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
                <input type="password" id="pf-current-pw" required
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue"
                    placeholder="Enter your current password">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <input type="password" id="pf-new-pw" required minlength="6"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue"
                        placeholder="Min. 6 characters">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                    <input type="password" id="pf-confirm-pw" required minlength="6"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue"
                        placeholder="Repeat new password">
                </div>
            </div>
            <div class="flex justify-end pt-2">
                <button type="submit" id="pw-save-btn"
                    class="bg-red-500 text-white font-bold py-2.5 px-8 rounded-xl hover:bg-red-600 transition shadow-md flex items-center gap-2">
                    <i class="fas fa-lock"></i> Change Password
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 z-[999] hidden">
    <div id="toast-inner" class="flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl text-white font-bold text-sm">
        <i id="toast-icon" class="fas fa-check-circle text-lg"></i>
        <span id="toast-msg"></span>
    </div>
</div>

<script>
const token = () => localStorage.getItem('access_token');

function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    const inner = document.getElementById('toast-inner');
    const icon  = document.getElementById('toast-icon');
    document.getElementById('toast-msg').textContent = msg;
    inner.className = `flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl text-white font-bold text-sm ${type === 'success' ? 'bg-green-600' : 'bg-red-500'}`;
    icon.className  = `fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-lg`;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3500);
}

async function loadProfile() {
    const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token() } });
    if (!res.ok) { window.location.href = '/login'; return; }

    const user = await res.json();

    // Header card
    const name = user.profile?.full_name || user.email.split('@')[0];
    document.getElementById('avatar-circle').textContent   = name[0].toUpperCase();
    document.getElementById('profile-name-display').textContent  = name;
    document.getElementById('profile-email-display').textContent = user.email;
    document.getElementById('profile-role-display').textContent  = user.role;

    // Form fields
    document.getElementById('pf-full-name').value = user.profile?.full_name || '';
    document.getElementById('pf-phone').value     = user.profile?.phone || '';
    document.getElementById('pf-email').value     = user.email;
}

async function saveProfile(e) {
    e.preventDefault();
    const btn = document.getElementById('pf-save-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    const res = await fetch('/api/auth/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() },
        body: JSON.stringify({
            full_name: document.getElementById('pf-full-name').value.trim(),
            phone:     document.getElementById('pf-phone').value.trim(),
            email:     document.getElementById('pf-email').value.trim(),
        })
    });

    btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Save Info';

    if (res.ok) {
        showToast('Profile updated successfully!');
        loadProfile();
    } else {
        const err = await res.json();
        showToast(err.message || 'Update failed', 'error');
    }
}

async function savePassword(e) {
    e.preventDefault();
    const newPw     = document.getElementById('pf-new-pw').value;
    const confirmPw = document.getElementById('pf-confirm-pw').value;

    if (newPw !== confirmPw) { showToast('Passwords do not match', 'error'); return; }

    const btn = document.getElementById('pw-save-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    const res = await fetch('/api/auth/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() },
        body: JSON.stringify({
            current_password: document.getElementById('pf-current-pw').value,
            new_password:     newPw,
        })
    });

    btn.disabled = false; btn.innerHTML = '<i class="fas fa-lock"></i> Change Password';

    if (res.ok) {
        showToast('Password changed successfully!');
        document.getElementById('password-form').reset();
    } else {
        const err = await res.json();
        showToast(err.message || 'Password change failed', 'error');
    }
}

loadProfile();
</script>
{% endblock %}
